name: Feature Request
description: Suggest an idea or improvement for TrayTrigger
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or friction that led to this request, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Existing settings, workarounds, or other tools you've tried
    validations:
      required: false
