name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v', 'V')
            $tag = "v$ver"
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v', 'V')
          }
          Write-Host "Releasing version: $ver with tag $tag"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            echo "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Publish Single-File Application
        shell: pwsh
        run: |
          dotnet publish TrayTrigger.csproj -c Release -r win-x64 --self-contained -o publish/bin /p:Version=${{ env.VERSION }}

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/installer -Force | Out-Null
          Compress-Archive -Path "publish/bin/*" -DestinationPath "publish/installer/TrayTrigger-v${{ env.VERSION }}-portable.zip" -Force

      - name: Compile Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          ISCC.exe /DMyAppVersion=${{ env.VERSION }} setup.iss

      - name: Verify Generated Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path publish/installer | Format-Table Name, Length, LastWriteTime

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne $env:TAG_NAME } | Select-Object -First 1

          if ($prevTag) {
            $range = "$prevTag..$env:TAG_NAME"
            $compareLine = "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...$env:TAG_NAME"
          } else {
            $range = $env:TAG_NAME
            $compareLine = ""
          }

          $commitLines = git log $range --no-merges --pretty=format:"- %s"
          if (-not $commitLines) {
            $commits = "- No notable changes."
          } else {
            $commits = ($commitLines -join "`n")
          }

          @("## What's Changed", $commits, "", $compareLine) -join "`n" | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "TrayTrigger v${{ env.VERSION }}"
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            publish/installer/TrayTrigger-v*-Setup.exe
            publish/installer/TrayTrigger-v*-portable.zip
