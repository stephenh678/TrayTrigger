name: CI

on:
  push:
    branches: [main, prerelease]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'review-notes/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'review-notes/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build TrayTrigger.csproj -c Release

      - name: Test
        run: dotnet test TrayTrigger.Tests/TrayTrigger.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/tests.trx'
          if-no-files-found: ignore
